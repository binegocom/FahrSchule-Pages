<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark Asphalt Road Surface -->
  <rect width="100" height="100" rx="8" fill="#1E293B"/>
  
  <!-- Solid stop line -->
  <line x1="0" y1="36" x2="100" y2="36" stroke="#FFFFFF" stroke-width="10"/>
  <!-- STOP lettering on roadway -->
  <text x="50" y="68" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" transform="scale(1, 1) translate(0, -14)">STOP</text>

</svg>
