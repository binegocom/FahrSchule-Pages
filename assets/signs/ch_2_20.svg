      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#004B91" stroke="#003366" stroke-width="1.5" filter="url(#shadowBlue)"/>
