  <line x1="20" y1="50" x2="80" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="29" y1="29" x2="71" y2="71" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 4"/>
