<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <polygon points="50,8 94,86 6,86" fill="#FFFFFF" stroke="#D52B1E" stroke-width="9.5" stroke-linejoin="round" filter="url(#shadow)"/>
  <polygon points="50,15 86,81 14,81" fill="#FFFFFF"/>
  <g fill="#111827" stroke="#111827">
    
  <!-- Car silhouette in skid -->
  <g transform="translate(50, 48) rotate(-12) translate(-50, -48)">
    <rect x="36" y="38" width="28" height="14" rx="4" fill="#111827" stroke="none"/>
    <rect x="41" y="33" width="18" height="8" rx="2" fill="#111827" stroke="none"/>
    <circle cx="41" cy="52" r="3.5" fill="#111827" stroke="none"/>
    <circle cx="59" cy="52" r="3.5" fill="#111827" stroke="none"/>
  </g>
  <!-- Skid tracks -->
  <path d="M 36 62 Q 44 67 38 72 Q 32 77 40 80" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 58 62 Q 66 67 60 72 Q 54 77 62 80" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>

  </g>
</svg>
